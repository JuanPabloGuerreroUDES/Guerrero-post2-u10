<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestión de Tareas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h1 id="titulo-pagina">Gestión de Tareas</h1>

    <!-- Formulario nueva tarea -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Nueva Tarea</h5>
            <form id="form-nueva-tarea" th:action="@{/tareas}" method="post">
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" id="titulo" name="titulo"
                           class="form-control" placeholder="Título de la tarea" required/>
                </div>
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion"
                           class="form-control" placeholder="Descripción (opcional)"/>
                </div>
                <button type="submit" id="btn-nueva" class="btn btn-primary">
                    Agregar Tarea
                </button>
            </form>
        </div>
    </div>

    <!-- Lista de tareas -->
    <h2>Lista de Tareas</h2>
    <div id="lista-tareas">
        <div th:if="${#lists.isEmpty(tareas)}" class="alert alert-info">
            No hay tareas registradas.
        </div>
        <div th:each="tarea : ${tareas}"
             class="tarea-item card mb-2"
             th:classappend="${tarea.completada} ? 'border-success' : 'border-warning'">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <span th:id="'titulo-' + ${tarea.id}"
                          th:text="${tarea.titulo}"
                          th:class="${tarea.completada} ? 'text-decoration-line-through' : ''">
                    </span>
                    <small class="text-muted ms-2" th:text="${tarea.descripcion}"></small>
                </div>
                <div>
                    <span th:if="${tarea.completada}"
                          class="badge bg-success tarea-estado">Completada</span>
                    <span th:unless="${tarea.completada}"
                          class="badge bg-warning text-dark tarea-estado">Pendiente</span>
                    <form th:unless="${tarea.completada}"
                          th:action="@{/tareas/{id}/completar(id=${tarea.id})}"
                          method="post" class="d-inline ms-2">
                        <button type="submit"
                                th:id="'btn-completar-' + ${tarea.id}"
                                class="btn btn-sm btn-success btn-completar">
                            Completar
                        </button>
                    </form>
                    <form th:action="@{/tareas/{id}/eliminar(id=${tarea.id})}"
                          method="post" class="d-inline ms-1">
                        <button type="submit"
                                th:id="'btn-eliminar-' + ${tarea.id}"
                                class="btn btn-sm btn-danger btn-eliminar">
                            Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
